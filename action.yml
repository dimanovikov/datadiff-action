name: datadiff semantic diff
description: >-
  Semantic diff for JSON, YAML, CSV, TOML and XML. Fail CI on any data
  change or only on risky paths (--fail-on).
author: dimanovikov
branding:
  icon: git-compare
  color: blue

inputs:
  old:
    description: Path to the old file
    required: true
  new:
    description: Path to the new file
    required: true
  key:
    description: Key field used to match objects inside arrays (e.g. id)
    required: false
    default: ""
  fail-on:
    description: >-
      Comma-separated path patterns (e.g. spec.replicas,*.image). The step
      fails only when a change path matches one of them.
    required: false
    default: ""
  format:
    description: Force the input format (json|yaml|csv|toml|xml)
    required: false
    default: ""
  version:
    description: datadiff version to install (e.g. v0.2.0) or "latest"
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Install datadiff (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -eu
        case "${{ runner.os }}/${{ runner.arch }}" in
          Linux/X64)     target="x86_64-unknown-linux-gnu" ;;
          Linux/ARM64)   target="aarch64-unknown-linux-gnu" ;;
          macOS/ARM64)   target="aarch64-apple-darwin" ;;
          *) echo "error: no prebuilt datadiff binary for ${{ runner.os }}/${{ runner.arch }}" >&2; exit 1 ;;
        esac
        tag="$VERSION"
        if [ "$tag" = "latest" ]; then
          tag=$(curl -fsSL "https://api.github.com/repos/dimanovikov/datadiff/releases/latest" \
            | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
        fi
        url="https://github.com/dimanovikov/datadiff/releases/download/$tag/datadiff-$tag-$target.tar.gz"
        tmp=$(mktemp -d)
        echo "Downloading $url"
        curl -fsSL "$url" | tar -xz -C "$tmp"
        echo "$tmp" >> "$GITHUB_PATH"
        echo "datadiff $tag installed"

    - name: Install datadiff (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
      run: |
        $tag = $env:VERSION
        if ($tag -eq "latest") {
          $tag = (Invoke-RestMethod "https://api.github.com/repos/dimanovikov/datadiff/releases/latest").tag_name
        }
        $url = "https://github.com/dimanovikov/datadiff/releases/download/$tag/datadiff-$tag-x86_64-pc-windows-msvc.zip"
        $tmp = Join-Path $env:RUNNER_TEMP ("datadiff-" + [Guid]::NewGuid())
        New-Item -ItemType Directory -Path $tmp | Out-Null
        Write-Host "Downloading $url"
        Invoke-WebRequest $url -OutFile (Join-Path $tmp "datadiff.zip")
        Expand-Archive (Join-Path $tmp "datadiff.zip") -DestinationPath $tmp
        Add-Content $env:GITHUB_PATH $tmp
        Write-Host "datadiff $tag installed"

    - name: Run datadiff
      shell: bash
      env:
        DD_OLD: ${{ inputs.old }}
        DD_NEW: ${{ inputs.new }}
        DD_KEY: ${{ inputs.key }}
        DD_FAIL_ON: ${{ inputs.fail-on }}
        DD_FORMAT: ${{ inputs.format }}
      run: |
        args=("$DD_OLD" "$DD_NEW")
        [ -n "$DD_KEY" ]     && args+=(--key "$DD_KEY")
        [ -n "$DD_FAIL_ON" ] && args+=(--fail-on "$DD_FAIL_ON")
        [ -n "$DD_FORMAT" ]  && args+=(--format "$DD_FORMAT")
        set +e
        datadiff "${args[@]}"
        code=$?
        set -e
        case $code in
          0) echo "no (matching) changes" ;;
          1) echo "::error::datadiff found changes (or --fail-on matched)" ;;
          *) echo "::error::datadiff failed with exit code $code" ;;
        esac
        exit $code
